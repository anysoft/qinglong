name: Linux CI Foundation

on:
  pull_request:
  push:
    branches: [main, master, develop, 'codex/**']
  workflow_dispatch:
    inputs:
      scope:
        description: Core only or all acceptance jobs
        type: choice
        options: [normal, full]
        default: full
  workflow_call:
    inputs:
      scope:
        type: string
        default: full

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope == 'full' && github.run_id || 'normal' }}
  cancel-in-progress: ${{ inputs.scope != 'full' }}

defaults:
  run:
    shell: bash

env:
  CI_SCOPE: ${{ inputs.scope || 'normal' }}
  CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  CI_RUNNER_LABEL: github-hosted-ubuntu-24.04

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      upload: ${{ steps.artifact.outcome }}
      artifact: linux-preflight-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    env:
      CI_JOB_NAME: preflight
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Execute repository CI scripts
        run: scripts/ci/run-job.sh preflight
      - name: Recover interrupted collection and owned cleanup
        if: always()
        run: node scripts/ci/ci.cjs finish
      - name: Upload scrubbed diagnostics
        id: artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-preflight-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ci-packages/*.tar.gz
            ci-artifacts/preflight-*/ci-summary.json
            ci-artifacts/preflight-*/preflight.json

  core:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      upload: ${{ steps.artifact.outcome }}
      artifact: linux-core-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    env:
      CI_JOB_NAME: core
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Execute repository CI scripts
        run: scripts/ci/run-job.sh core
      - name: Recover interrupted collection and owned cleanup
        if: always()
        run: node scripts/ci/ci.cjs finish
      - name: Upload scrubbed diagnostics
        id: artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-core-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ci-packages/*.tar.gz
            ci-artifacts/core-*/ci-summary.json
            ci-artifacts/core-*/core-summary.json

  managed-runtime:
    needs: preflight
    if: ${{ inputs.scope == 'full' || (!inputs.scope && github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'develop')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      upload: ${{ steps.artifact.outcome }}
      artifact: linux-managed-runtime-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    env:
      CI_JOB_NAME: managed-runtime
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Execute repository CI scripts
        run: scripts/ci/run-job.sh managed-runtime
      - name: Recover interrupted collection and owned cleanup
        if: always()
        run: node scripts/ci/ci.cjs finish
      - name: Upload scrubbed diagnostics
        id: artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-managed-runtime-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ci-packages/*.tar.gz
            ci-artifacts/managed-runtime-*/ci-summary.json
            ci-artifacts/managed-runtime-*/managed-summary.json

  browser:
    needs: preflight
    if: ${{ inputs.scope == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      upload: ${{ steps.artifact.outcome }}
      artifact: linux-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    env:
      CI_JOB_NAME: browser
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Execute repository CI scripts
        run: scripts/ci/run-job.sh browser
      - name: Recover interrupted collection and owned cleanup
        if: always()
        run: node scripts/ci/ci.cjs finish
      - name: Upload scrubbed diagnostics
        id: artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ci-packages/*.tar.gz
            ci-artifacts/browser-*/ci-summary.json
            ci-artifacts/browser-*/browser-summary.json

  ci-summary:
    needs: [preflight, core, managed-runtime, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        id: download
        continue-on-error: true
        with:
          pattern: linux-*
          path: ci-downloaded
      - name: Aggregate real job and test results
        if: always()
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_COMMIT: ${{ github.sha }}
          CI_DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: node scripts/ci/summary.cjs
      - uses: actions/upload-artifact@v6
        id: summary-artifact
        if: always()
        with:
          name: linux-summary-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: diagnostics/ci/final-summary.json
      - name: Report summary upload failure
        if: ${{ always() && steps.summary-artifact.outcome == 'failure' }}
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_COMMIT: ${{ github.sha }}
          CI_FINAL_UPLOAD: failure
        run: node scripts/ci/summary.cjs
