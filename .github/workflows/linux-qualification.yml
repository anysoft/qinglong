name: Linux Qualification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-qualification-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  foundation:
    uses: ./.github/workflows/linux-ci.yml
    with:
      scope: full

  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      upload: ${{ steps.artifact.outcome }}
    env:
      CI_OUTPUT: ${{ github.workspace }}/diagnostics/qualification
      CI_JOB_NAME: qualification
      CI_SCOPE: full
      CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CI_RUNNER_LABEL: github-hosted-ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install platform build and qualification tools
        run: node scripts/ci/ci.cjs install system
      - name: Validate Ubuntu 24.04
        run: node scripts/ci/ci.cjs preflight
      - name: Install locked project dependencies
        run: node scripts/ci/ci.cjs install
      - name: Execute native, crash, concurrency and scale qualification
        run: node scripts/qualification/run.cjs
      - name: Recover interrupted collection and owned cleanup
        if: always()
        run: node scripts/ci/ci.cjs finish
      - name: Upload scrubbed qualification evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase15-qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ci-packages/*.tar.gz
            ci-artifacts/qualification-*/ci-summary.json
            ci-artifacts/qualification-*/tests/qualification.json
            ci-artifacts/qualification-*/cleanup/result.json

  qualification-summary:
    needs: [foundation, qualification]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        id: download
        continue-on-error: true
        with:
          path: qualification-downloaded
      - name: Aggregate foundation and qualification gates
        if: always()
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          CI_QUALIFICATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CI_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: node scripts/qualification/summary.cjs
      - uses: actions/upload-artifact@v6
        id: final-artifact
        if: always()
        with:
          name: phase15-final-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: diagnostics/phase15/hosted-final-gates.json
      - name: Report final upload failure
        if: ${{ always() && steps.final-artifact.outcome == 'failure' }}
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          CI_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_QUALIFICATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CI_FINAL_UPLOAD: failure
        run: node scripts/qualification/summary.cjs
